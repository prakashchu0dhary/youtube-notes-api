<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI YouTube to Exam Notes</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
    }
    label {
      font-size: 14px;
      font-weight: 600;
      color: #cbd5e1;
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      background: #2563eb;
      font-weight: bold;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #resultBox {
      margin-top: 24px;
      display: none;
      background: #0f172a;
      padding: 18px;
      border-radius: 8px;
      border: 1px solid #334155;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
    }
    .loading {
      text-align: center;
      color: #38bdf8;
      font-weight: 500;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🎯 AI YouTube to Exam Notes</h2>
  
  <label for="videoUrl">YouTube वीडियो लिंक दर्ज करें:</label>
  <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." />

  <label for="examType">परीक्षा का प्रकार चुनें:</label>
  <select id="examType">
    <option value="All Competitive Exams">All Competitive Exams</option>
    <option value="REET / Teacher Exams">REET / Teacher Exams</option>
    <option value="CET / Lab Assistant">CET / Lab Assistant</option>
    <option value="UPSC / State PSC">UPSC / State PSC</option>
    <option value="SSC / Railway">SSC / Railway</option>
  </select>

  <button id="genBtn" onclick="generateNotes()">स्मार्ट नोट्स तैयार करें</button>

  <div id="loader" class="loading">⏳ AI वीडियो से नोट्स तैयार कर रहा है (कुछ सेकंड लग सकते हैं)...</div>

  <div id="resultBox"></div>
</div>

<script>
  async function generateNotes() {
    const url = document.getElementById("videoUrl").value.trim();
    const examType = document.getElementById("examType").value;
    const btn = document.getElementById("genBtn");
    const loader = document.getElementById("loader");
    const resultBox = document.getElementById("resultBox");

    if (!url) {
      alert("कृपया यूट्यूब वीडियो का लिंक दर्ज करें।");
      return;
    }

    btn.disabled = true;
    loader.style.display = "block";
    resultBox.style.display = "none";
    resultBox.innerHTML = "";

    try {
      const response = await fetch("https://youtube-notes-api.onrender.com/api/generate-notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url, exam_type: examType })
      });

      const data = await response.json();

      if (response.ok && data.success) {
        resultBox.textContent = data.notes;
        resultBox.style.display = "block";
      } else {
        alert("त्रुटि: " + (data.detail || "नोट्स बनाने में समस्या आई।"));
      }
    } catch (err) {
      alert("सर्वर से कनेक्ट नहीं हो सका। कृपया 30 सेकंड बाद पुनः प्रयास करें।");
    } finally {
      btn.disabled = false;
      loader.style.display = "none";
    }
  }
</script>

</body>
  </html>
